name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build -f docker/Dockerfile -t ummelila/devops-app:v1 .

    - name: Push to Docker Hub
      run: |
        docker push ummelila/devops-app:v1

    - name: Deployment Success
      run: echo "✅ Pipeline Complete - DevOps Project"