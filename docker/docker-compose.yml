version: '3.8'
services:
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: backend
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=database
      - DB_USER=devuser
      - DB_PASS=devpass123
      - DB_NAME=devopsdb
    depends_on:
      - database

  database:
    image: mysql:8.0
    container_name: database
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass123
      - MYSQL_DATABASE=devopsdb
      - MYSQL_USER=devuser
      - MYSQL_PASSWORD=devpass123
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: